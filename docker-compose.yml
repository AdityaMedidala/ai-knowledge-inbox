# Local single-container run: `docker compose up --build`, then open http://localhost:8000
services:
  inbox:
    build: .
    image: ai-knowledge-inbox
    ports:
      - "${INBOX_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      SEED_ON_EMPTY: "on"
    volumes:
      - inbox-data:/data
    restart: unless-stopped

volumes:
  inbox-data:
