[project]
name = "ai-knowledge-inbox"
version = "0.1.0"
description = "Save notes and URLs, ask questions, get cited answers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "asgi-correlation-id>=4.3",
    "sqlite-vec>=0.1.6",
    "openai>=3.52",
    "tiktoken>=0.14",
    "httpx2>=2.16",
    "fastembed>=0.9.1",
    "trafilatura>=2.3.1",
]

[project.optional-dependencies]
cohere = [
    "cohere>=7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false
# pyenv/Homebrew builds often lack sqlite3.enable_load_extension; uv's builds have it.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # S311: seeded random for test data

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# trafilatura imports urllib3.contrib.socks; we never use SOCKS proxies.
filterwarnings = ["ignore:SOCKS support in urllib3:urllib3.exceptions.DependencyWarning"]
